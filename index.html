<!doctype html>
<html lang="">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="%BASE_URL%favicon.ico" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>GAS711</title>
    <link rel="stylesheet" href="%BASE_URL%icons/sprite.svg" />
    <!-- 运行时配置：运维可以在部署后修改 config.js 中的 API 地址 -->
    <script src="%BASE_URL%config.js"></script>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <!-- 静态等待页：JS/站点校验完成前一直显示，避免空白或闪出业务页 -->
    <div id="app">
      <div
        id="site-boot-waiting"
        style="
          position: fixed;
          inset: 0;
          z-index: 99999;
          display: flex;
          align-items: center;
          justify-content: center;
          width: 100vw;
          height: 100vh;
          margin: 0;
          padding: 24px;
          box-sizing: border-box;
          background: #293445;
          font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        "
      >
        <div style="display: flex; flex-direction: column; align-items: center; text-align: center">
          <div
            style="
              width: 44px;
              height: 44px;
              margin-bottom: 20px;
              border-radius: 50%;
              border: 3px solid rgba(255, 255, 255, 0.15);
              border-top-color: #165dff;
              animation: site-boot-spin 0.8s linear infinite;
            "
          ></div>
          <p
            id="boot-title"
            style="
              margin: 0 0 8px;
              font-size: 16px;
              font-weight: 500;
              color: #fff;
              display: inline-flex;
              align-items: baseline;
            "
          >
            <span id="boot-title-text">正在校验站点</span
            ><span class="boot-dots" aria-hidden="true"
              ><span class="boot-dot">.</span><span class="boot-dot">.</span
              ><span class="boot-dot">.</span></span
            >
          </p>
          <p id="boot-hint" style="margin: 0; font-size: 13px; color: rgba(255, 255, 255, 0.55)">
            加载中...
          </p>
        </div>
      </div>
      <style>
        @keyframes site-boot-spin {
          to {
            transform: rotate(360deg);
          }
        }
        .boot-dots {
          display: inline-flex;
          margin-left: 1px;
          min-width: 1.2em;
        }
        .boot-dot {
          display: inline-block;
          animation: site-boot-dot-bounce 1.2s ease-in-out infinite;
        }
        .boot-dot:nth-child(1) {
          animation-delay: 0s;
        }
        .boot-dot:nth-child(2) {
          animation-delay: 0.15s;
        }
        .boot-dot:nth-child(3) {
          animation-delay: 0.3s;
        }
        @keyframes site-boot-dot-bounce {
          0%,
          60%,
          100% {
            transform: translateY(0);
            opacity: 0.45;
          }
          30% {
            transform: translateY(-5px);
            opacity: 1;
          }
        }
      </style>
      <script>
        // 尽早识别 Mini App：静态启动页改「正在登录中」，并隐藏「加载中」
        ;(function () {
          function isTelegramEnv() {
            try {
              var tg = window.Telegram && window.Telegram.WebApp
              if (tg && (tg.initData || tg.platform || tg.version)) return true
              var loc = String(location.search || '') + String(location.hash || '')
              if (/tgWebApp/i.test(loc)) return true
              if (/Telegram/i.test(navigator.userAgent || '')) return true
            } catch (e) {}
            return false
          }

          function applyMiniAppWaiting() {
            if (!isTelegramEnv()) return false
            var text = document.getElementById('boot-title-text')
            var hint = document.getElementById('boot-hint')
            if (text) text.textContent = '正在登录中'
            if (hint) hint.style.display = 'none'
            return true
          }

          if (!applyMiniAppWaiting()) {
            var n = 0
            var timer = setInterval(function () {
              n += 1
              if (applyMiniAppWaiting() || n > 40) clearInterval(timer)
            }, 50)
          }
        })()
      </script>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <!-- Umami 数据埋点（仅生产环境加载） -->
    <script type="module">
      if (import.meta.env.PROD) {
        var script = document.createElement('script')
        script.src = 'https://umami.gaod2o.shop/script.js'
        script.defer = true
        script.setAttribute('data-website-id', '2784fbb9-4b6b-4187-85d4-a47d6c83d611')
        document.head.appendChild(script)
      }
    </script>
  </body>
</html>
